# This extension patches files of another extension and of VS Code itself, and draws inside Claude Code's panel. Where
# those files are, whether they can be written, and how the window draws differ between Linux, macOS and Windows. The
# tests workflow runs on Linux only and without either install. This one installs the newest VS Code, Claude Code and
# Agent Plus on each of the three and runs the extension in a real window (test/vscode/run.js): it drives the window,
# checks what it shows, compares crops of this extension's elements with the approved copies for that platform, and then
# checks the patched files from inside VS Code. It runs once a day and by hand, not on a push or a pull request, which
# run only the checks of tests.yml: a full run takes three platforms for a quarter of an hour. Run by hand, Claude Code is
# by default the newest build supported-versions.json records and Agent Plus the commit test/vscode/agent-plus-commit
# names, both moved on on purpose; once a day it runs against the newest of each, since either can change without a
# commit here, and a failure then says this extension has to follow or that a change here broke a step.
#
# The results folder of each job is kept as an artifact whether the run passed or not: the screenshots of every step,
# the crops, a diff image of each crop that failed, what each page of the window held when a step failed, and VS Code's
# logs. A platform with no approved copies yet only saves its crops there, with a note in the log.
#
# Each platform's run is split into four jobs that run at once, each a run of consecutive window steps of about the same
# length (CLAUDE_CODE_PLUS_UI_SHARD), and a fifth with the suite inside VS Code and test/check.js. Run by hand, the
# workflow takes the platforms to run on and a regular expression for the window steps to run; given one, each platform
# runs those steps in one job, without the suite. To try a fix for a step that fails on one platform:
#   gh workflow run vscode.yml --ref <branch> -f os=macos-latest -f steps='^the steward panel$'
name: vscode

on:
  # A change to this workflow is tried by running it by hand on its branch.
  schedule:
    # 09:43 UTC. Not on the hour or the half hour, when the scheduler is busiest, and apart from upstream-check.yml's.
    - cron: '43 9 * * *'
  workflow_dispatch:
    inputs:
      os:
        description: The runners to run on, separated by commas
        type: string
        default: ubuntu-latest,macos-latest,windows-latest
      steps:
        description: A regular expression; only the window steps whose names match it run, with the steps every run has. Empty runs all of them, split into jobs.
        type: string
        default: ''
      upstream:
        description: pinned runs against the Agent Plus commit in test/vscode/agent-plus-commit and the newest Claude Code in supported-versions.json; newest, against the newest of each
        type: choice
        options: [pinned, newest]
        default: pinned

permissions:
  contents: read

jobs:
  # The jobs of the run below, one per platform and part, and what they run against: a run by hand, by default, against
  # the Agent Plus commit in test/vscode/agent-plus-commit and the newest Claude Code in supported-versions.json, so that
  # a change in either does not fail it; the daily run, against the newest of each, and fails to say that this extension
  # has to follow them.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      agentPlus: ${{ steps.plan.outputs.agentPlus }}
      claudeCode: ${{ steps.plan.outputs.claudeCode }}
      label: ${{ steps.plan.outputs.label }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            supported-versions.json
            test/vscode/agent-plus-commit
          sparse-checkout-cone-mode: false
      - id: plan
        shell: bash
        env:
          OS: ${{ inputs.os || 'ubuntu-latest,macos-latest,windows-latest' }}
          STEPS: ${{ inputs.steps }}
          NEWEST: ${{ github.event_name == 'schedule' || inputs.upstream == 'newest' }}
        run: |
          node -e '
            const fs = require("fs");
            const os = process.env.OS.split(",").map((x) => x.trim()).filter(Boolean);
            const parts = process.env.STEPS ? [{ shard: "", part: "steps" }]
              : [...[1, 2, 3, 4].map((i) => ({ shard: `${i}/4`, part: `${i}-of-4` })), { shard: "suite", part: "suite" }];
            const include = os.flatMap((o) => parts.map((p) => ({ os: o, ...p })));
            const newest = process.env.NEWEST === "true";
            const num = (v) => v.split(".").map(Number);
            const later = (a, b) => { const x = num(a), y = num(b); for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0) ? a : b; return a; };
            const agentPlus = newest ? "" : fs.readFileSync("test/vscode/agent-plus-commit", "utf8").trim();
            const claudeCode = newest ? "" : Object.keys(JSON.parse(fs.readFileSync("supported-versions.json", "utf8")).claudeCode).reduce(later);
            const label = newest ? ", newest upstream" : "";
            const out = { matrix: JSON.stringify({ include }), agentPlus, claudeCode, label };
            fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(out).map(([k, v]) => `${k}=${v}\n`).join(""));
            const said = `Agent Plus ${agentPlus || "at the head of its default branch"}, Claude Code ${claudeCode || "newest on the marketplace"}`;
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, said + "\n");
            console.log(said);
            console.log(JSON.stringify(include));'

  package:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the .vsix
        shell: bash
        run: |
          vsix=$(bash build/pack.sh | tail -n 1)
          mv "$vsix" extension.vsix
      # This extension depends on Agent Plus, so the run installs it too. Checked out after the build above, whose
      # checks read the files under this folder.
      - uses: actions/checkout@v7
        with:
          repository: xnervwang/vscode-agent-plus
          ref: ${{ needs.plan.outputs.agentPlus }}
          path: agent-plus
      - name: Build Agent Plus's .vsix
        shell: bash
        run: |
          core=$(cd agent-plus && bash build/pack.sh | tail -n 1)
          mv "$core" core.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: |
            extension.vsix
            core.vsix

  run:
    needs: [plan, package]
    name: run (${{ matrix.os }}, ${{ matrix.part }}${{ needs.plan.outputs.label }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      CLAUDE_CODE_PLUS_UI_SHARD: ${{ matrix.shard }}
      CLAUDE_CODE_PLUS_UI_STEPS_RE: ${{ inputs.steps }}
      CLAUDE_CODE_PLUS_UI_CLAUDE_CODE: ${{ needs.plan.outputs.claudeCode }}
    steps:
      # Some checks compare source text, so no CRLF on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      # playwright-core rather than playwright: the run connects to VS Code's own Electron and needs no browser of its own.
      - name: Install the test runner
        shell: bash
        run: npm install --no-save --no-package-lock @vscode/test-electron@3 playwright-core@1
      # run.js puts the test stage in a user and network namespace of its own, with loopback only. Ubuntu's AppArmor
      # forbids an unprivileged user namespace unless this is 0, and CLAUDE_CODE_PLUS_UI_OFFLINE=require below fails the
      # run when the stage cannot be cut off from the network.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The screen is given the size and depth the approved Linux crops were made at.
      - name: Run in VS Code
        if: runner.os == 'Linux'
        shell: bash
        env:
          CLAUDE_CODE_PLUS_UI_OFFLINE: require
        run: xvfb-run -a -s '-screen 0 1600x1000x24' node test/vscode/run.js extension.vsix core.vsix --out vscode-results
      # macOS and Windows have no namespace to put it in: there the test stage only gets a proxy that does not exist.
      - name: Run in VS Code
        if: runner.os != 'Linux'
        shell: bash
        run: node test/vscode/run.js extension.vsix core.vsix --out vscode-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vscode-${{ runner.os }}-${{ matrix.part }}
          path: vscode-results
          if-no-files-found: warn
